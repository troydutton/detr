[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "detr"
version = "0.1.0"
description = "Detection Transformers"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "accelerate>=1.13.0",
    "faster-coco-eval>=1.8.0",
    "hydra-core>=1.3.2",
    "imageio[ffmpeg]>=2.37.0",
    "matplotlib>=3.10.9",
    "numpy>=1.26.4,<2",
    "onnx==1.21.0",
    "onnx-ir==0.2.0",
    "onnxconverter-common>=1.16.0",
    "onnxscript==0.6.2",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "pycocotools>=2.0.11",
    "rich>=15.0.0",
    "safetensors>=0.7.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
    "transformers>=5.9.0",
    "wandb>=0.30.0",
]

[dependency-groups]
cpu = ["torch==2.11.0", "torchvision==0.26.0", "onnxruntime==1.24.4"]
gpu = ["torch==2.11.0", "torchvision==0.26.0", "onnxruntime-gpu==1.24.4", "tensorrt-cu12==11.0.0.114"]
dev = ["black>=26.5.1", "ipykernel>=7.2.0", "ipywidgets>=8.1.8", "pre-commit>=4.6.0", "pytest>=9.1.1", "ruff>=0.15.14", "scipy-stubs>=1.17.1.4"]

[tool.uv]
default-groups = ["dev", "gpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", group = "cpu" }, { index = "pytorch-cu126", group = "gpu" }]
torchvision = [{ index = "pytorch-cpu", group = "cpu" }, { index = "pytorch-cu126", group = "gpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 140
lint.select = ["F", "I"]

[tool.black]
line-length = 140
target-version = ['py312']
